name: Build & Push Hermes image to GHCR

# Construit l'image Hermes (depuis le Dockerfile du repo) et la pousse sur
# ghcr.io/<owner>/hermes-defender. Dokploy tire ensuite cette image.
#
# Pré-requis : ce repo contient le Dockerfile de Hermes (ou le checkout du
# repo hermes-agent). Aucun secret à configurer : GITHUB_TOKEN suffit pour GHCR.
#
# NOTE pinning : pour une contribution au repo hermes-agent, la policy exige des
# actions épinglées par SHA (SHA + `# vN`). Ici c'est TON repo de déploiement ;
# les tags `@vN` conviennent, mais épingler par SHA reste recommandé.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hermes-defender

permissions:
  contents: read
  packages: write        # requis pour push vers GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
