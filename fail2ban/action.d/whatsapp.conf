# Action fail2ban : notifie WhatsApp quand une IP est bannie (ban/unban).
# fail2ban fait le BLOCAGE (nftables/iptables) ; cette action ne fait qu'alerter.
# Place ce fichier dans /etc/fail2ban/action.d/ sur l'HÔTE.
#
# Nécessite notify-whatsapp.sh accessible sur l'hôte + les variables GOWA_*/WA_*.
# Renseigne-les en tête du script ou via /etc/default/hermes-defender.

[Definition]
actionban   = /opt/defender/scripts/notify-whatsapp.sh "🚨 BAN <ip> sur <name> (jail <name>) — <failures> tentatives. VPS: %(vps)s"
actionunban = /opt/defender/scripts/notify-whatsapp.sh "✅ UNBAN <ip> (jail <name>). VPS: %(vps)s"

[Init]
vps = vmi3096991
